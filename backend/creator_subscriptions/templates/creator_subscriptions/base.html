<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Creator Subscriptions{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #161616;
      --muted: #5b616e;
      --line: #d4d7dd;
      --panel: #f7f8fa;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --danger: #b42318;
      --ok: #087443;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: #ffffff;
    }
    a {
      color: var(--accent-strong);
    }
    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    nav,
    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
    }
    nav {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    nav ul {
      display: flex;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
      flex-wrap: wrap;
      align-items: center;
    }
    main {
      padding: 40px 0 64px;
    }
    h1 {
      max-width: 760px;
      margin: 0 0 16px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.05;
    }
    h2 {
      margin-top: 32px;
    }
    p {
      max-width: 720px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 24px 0;
    }
    .button,
    button {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 8px 14px;
      color: #ffffff;
      background: var(--accent);
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }
    .button.secondary {
      color: var(--accent-strong);
      background: #ffffff;
    }
    .status {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      background: var(--panel);
      font-weight: 650;
    }
    .status.ok {
      color: var(--ok);
    }
    .status.no {
      color: var(--danger);
    }
    .messages {
      padding: 0;
      margin: 0 0 24px;
      list-style: none;
    }
    .messages li,
    .notice {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: var(--panel);
    }
    form {
      max-width: 560px;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 650;
    }
    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    input[type="checkbox"],
    input[type="radio"] {
      width: auto;
      min-height: auto;
      margin-right: 6px;
      padding: 0;
    }
    form p:has(input[type="checkbox"]),
    form p:has(input[type="radio"]) {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    form p:has(input[type="checkbox"]) label,
    form p:has(input[type="radio"]) label {
      margin: 0;
    }
    .helptext,
    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .errorlist {
      color: var(--danger);
    }
    code {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 4px;
      background: var(--panel);
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a href="{% url 'creator_subscriptions:home' %}"><strong>Creator Subscriptions</strong></a>
      <ul>
        <li><a href="{% url 'blog:post_list' %}">Blog</a></li>
        <li><a href="{% url 'creator_subscriptions:members_only' %}">Members</a></li>
        {% if user.is_authenticated %}
          <li><a href="{% url 'creator_subscriptions:profile' %}">Profile</a></li>
          <li><a href="{% url 'account_logout' %}">Log out</a></li>
        {% else %}
          <li><a href="{% url 'account_login' %}">Log in</a></li>
          <li><a href="{% url 'creator_subscriptions:register' %}">Register</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
